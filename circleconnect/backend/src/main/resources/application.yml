server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:circleconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    firebase-admin-credentials: ${FIREBASE_ADMIN_CREDENTIALS:}

logging:
  level:
    com.circleconnect: INFO